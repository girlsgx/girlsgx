<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlsGX — Галерея 2</title>
  <style>
    :root {
      --bg:#0d0d0f;--card:#16161a;--text:#f5f5f7;--muted:#a1a1aa;
      --pink:#f9a8d4;--pink-soft:#f472b6;--border:rgba(249,168,212,.15);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
    .container{max-width:1200px;margin:0 auto;padding:0 20px}
    #age-gate{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center}
    #age-gate.hidden{display:none}
    .age-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 36px;text-align:center;max-width:380px;width:90%}
    .age-box h2{color:var(--pink);font-size:1.6rem;margin-bottom:12px}
    .age-box p{color:var(--muted);margin-bottom:28px;font-size:.95rem}
    .age-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{padding:12px 28px;border-radius:50px;border:none;font-size:1rem;cursor:pointer;font-weight:600}
    .btn-yes{background:var(--pink-soft);color:#111}
    .btn-no{background:transparent;color:var(--muted);border:1px solid var(--border)}
    .top-bar{text-align:center;padding:28px 0 20px;border-bottom:1px solid var(--border)}
    .top-bar .badge{display:inline-block;font-size:.75rem;letter-spacing:.12em;color:var(--pink);margin-bottom:6px}
    .top-bar h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:700}
    .back-link{display:inline-block;margin-top:14px;color:var(--muted);text-decoration:none;font-size:.9rem}
    .back-link:hover{color:var(--pink)}
    .gallery-section{padding:36px 0 50px}
    .section-title{text-align:center;font-size:1.15rem;color:var(--muted);margin-bottom:24px}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
    .gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;cursor:pointer;border:1px solid var(--border);background:var(--card);transition:transform .25s}
    .gallery img:hover{transform:scale(1.03)}
    #lightbox{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center}
    #lightbox.open{display:flex}
    #lightbox img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px}
    .lightbox-close{position:absolute;top:16px;right:20px;width:44px;height:44px;background:rgba(255,255,255,.1);border:none;border-radius:50%;color:#fff;font-size:1.6rem;cursor:pointer}
    .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;background:rgba(255,255,255,.1);border:none;border-radius:50%;color:#fff;font-size:1.8rem;cursor:pointer}
    .lb-prev{left:16px}.lb-next{right:16px}
    .lb-counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:.9rem}
    footer{text-align:center;padding:30px 20px 40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border)}
    footer a{color:var(--pink);text-decoration:none}
    @media(max-width:768px){.gallery{grid-template-columns:repeat(2,1fr);gap:10px}.lb-nav{width:40px;height:40px;font-size:1.5rem}.lb-prev{left:8px}.lb-next{right:8px}}
    @media(max-width:480px){.age-btns{flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <div id="age-gate">
    <div class="age-box">
      <h2>18+</h2>
      <p>Этот контент предназначен только для взрослых. Вам есть 18 лет?</p>
      <div class="age-btns">
        <button class="btn btn-yes" id="age-yes">Да, мне есть 18</button>
        <button class="btn btn-no" id="age-no">Нет</button>
      </div>
    </div>
  </div>
  <div class="top-bar">
    <div class="badge">ТОЛЬКО 18+</div>
    <h1>GirlsGX</h1>
    <a href="index.html" class="back-link">← На главную</a>
  </div>
  <section class="container gallery-section">
    <div class="section-title">Галерея 2 · 29 фото</div>
    <div class="gallery" id="gallery"></div>
  </section>
  <footer>
    <p>© 2026 GirlsGX. Все права защищены.</p>
    <p style="margin-top:8px">Связаться с нами: <a href="mailto:lortan16@gmail.com">lortan16@gmail.com</a></p>
  </footer>
  <div id="lightbox">
    <button class="lightbox-close" id="lb-close">×</button>
    <button class="lb-nav lb-prev" id="lb-prev">‹</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-nav lb-next" id="lb-next">›</button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>
  <script>
    const photos = [
      "images/galerea2/01.webp",
      "images/galerea2/02.webp",
      "images/galerea2/03.webp",
      "images/galerea2/04.webp",
      "images/galerea2/05.webp",
      "images/galerea2/06.webp",
      "images/galerea2/07.webp",
      "images/galerea2/08.webp",
      "images/galerea2/09.webp",
      "images/galerea2/10.webp",
      "images/galerea2/11.webp",
      "images/galerea2/12.webp",
      "images/galerea2/13.webp",
      "images/galerea2/14.webp",
      "images/galerea2/15.webp",
      "images/galerea2/16.webp",
      "images/galerea2/17.webp",
      "images/galerea2/18.webp",
      "images/galerea2/19.webp",
      "images/galerea2/20.webp",
      "images/galerea2/21.webp",
      "images/galerea2/22.webp",
      "images/galerea2/23.webp",
      "images/galerea2/24.webp",
      "images/galerea2/25.webp",
      "images/galerea2/26.webp",
      "images/galerea2/27.webp",
      "images/galerea2/28.webp",
      "images/galerea2/29.webp"
    ];
    const ageGate = document.getElementById('age-gate');
    if (sessionStorage.getItem('ageVerified') === '1') ageGate.classList.add('hidden');
    document.getElementById('age-yes').onclick = () => {
      sessionStorage.setItem('ageVerified', '1');
      ageGate.classList.add('hidden');
    };
    document.getElementById('age-no').onclick = () => window.location.href = 'https://www.google.com';

    const gallery = document.getElementById('gallery');
    photos.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src; img.alt = 'Photo ' + (i+1); img.loading = 'lazy';
      img.onclick = () => openLightbox(i);
      gallery.appendChild(img);
    });

    let current = 0;
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCounter = document.getElementById('lb-counter');
    function openLightbox(i) {
      current = i; lbImg.src = photos[current];
      lbCounter.textContent = (current+1) + ' / ' + photos.length;
      lb.classList.add('open'); document.body.style.overflow = 'hidden';
    }
    function closeLightbox() { lb.classList.remove('open'); document.body.style.overflow = ''; }
    function showNext(d) {
      current = (current + d + photos.length) % photos.length;
      lbImg.src = photos[current];
      lbCounter.textContent = (current+1) + ' / ' + photos.length;
    }
    document.getElementById('lb-close').onclick = closeLightbox;
    document.getElementById('lb-prev').onclick = () => showNext(-1);
    document.getElementById('lb-next').onclick = () => showNext(1);
    lb.onclick = e => { if (e.target === lb) closeLightbox(); };
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showNext(-1);
      if (e.key === 'ArrowRight') showNext(1);
    });
  </script>
</body>
</html>
