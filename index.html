<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlsGX</title>
  <style>
    :root {
      --bg:#0d0d0f;--card:#16161a;--text:#f5f5f7;--muted:#a1a1aa;
      --pink:#f9a8d4;--pink-soft:#f472b6;--border:rgba(249,168,212,.15);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
    .container{max-width:1200px;margin:0 auto;padding:0 20px}
    #age-gate{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center}
    .age-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 36px;text-align:center;max-width:380px;width:90%}
    .age-box h2{color:var(--pink);font-size:1.6rem;margin-bottom:12px}
    .age-box p{color:var(--muted);margin-bottom:28px;font-size:.95rem}
    .age-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{padding:12px 28px;border-radius:50px;border:none;font-size:1rem;cursor:pointer;font-weight:600}
    .btn-yes{background:var(--pink-soft);color:#111}
    .btn-no{background:transparent;color:var(--muted);border:1px solid var(--border)}
    .hero{text-align:center;padding:48px 0 32px}
    .hero .badge{display:inline-block;font-size:.75rem;letter-spacing:.12em;color:var(--pink);margin-bottom:8px}
    .hero h1{font-size:clamp(2rem,6vw,3rem);font-weight:700}
    .covers-row{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-bottom:50px}
    .cover-wrap{
      position:relative;flex:1 1 280px;max-width:420px;border-radius:16px;overflow:hidden;
      cursor:pointer;border:1px solid var(--border);background:var(--card);
      transition:transform .3s,box-shadow .3s;text-decoration:none;color:inherit;display:block;
    }
    .cover-wrap:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(244,114,182,.2)}
    .cover-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
    .cover-overlay{
      position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.7));
      display:flex;align-items:flex-end;justify-content:center;padding-bottom:24px;
    }
    .cover-play{
      background:var(--pink-soft);color:#111;padding:10px 22px;border-radius:50px;
      font-weight:600;font-size:.9rem;
    }
    .section-title{text-align:center;font-size:1.15rem;color:var(--muted);margin-bottom:24px}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding-bottom:50px}
    .gallery .card{border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid var(--border);background:var(--card)}
    .gallery .card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;transition:transform .25s}
    .gallery .card:hover img{transform:scale(1.04)}
    #lightbox{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center}
    #lightbox.active{display:flex}
    #lightbox img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px}
    .lightbox-close{position:absolute;top:16px;right:20px;width:44px;height:44px;background:rgba(255,255,255,.1);border:none;border-radius:50%;color:#fff;font-size:1.6rem;cursor:pointer}
    .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;background:rgba(255,255,255,.1);border:none;border-radius:50%;color:#fff;font-size:1.8rem;cursor:pointer}
    .lb-prev{left:16px}.lb-next{right:16px}
    .lb-counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:.9rem}
    footer{text-align:center;padding:30px 20px 40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border)}
    footer a{color:var(--pink);text-decoration:none}
    @media(max-width:768px){
      .covers-row{flex-direction:column;align-items:center}
      .cover-wrap{max-width:100%;width:100%}
      .gallery{grid-template-columns:repeat(2,1fr);gap:10px}
    }
  </style>
</head>

      { src: "https://static.wixstatic.com/media/d34ccd_04f1ac1885bd418c9a0ca6bdb7b15278~mv2.jpeg/v1/fit/w_2400,h_3600,q_95,enc_auto/d34ccd_04f1ac1885bd418c9a0ca6bdb7b15278~mv2.jpeg", title: "Photo 53" },
      { src: "https://static.wixstatic.com/media/d34ccd_61f559f32a47457eae850bd35cdd0d7b~mv2.jpeg/v1/fit/w_2400,h_3600,q_95,enc_auto/d34ccd_61f559f32a47457eae850bd35cdd0d7b~mv2.jpeg", title: "Photo 54" },
      { src: "https://static.wixstatic.com/media/d34ccd_2019f304ec5f4438b3539b028b0ae9b6~mv2.jpeg/v1/fit/w_2400,h_3600,q_95,enc_auto/d34ccd_2019f304ec5f4438b3539b028b0ae9b6~mv2.jpeg", title: "Photo 55" },
      { src: "https://static.wixstatic.com/media/d34ccd_369d3466dabc4b228a982a5ff1907b17~mv2.webp/v1/fit/w_2400,h_3600,q_95,enc_auto/d34ccd_369d3466dabc4b228a982a5ff1907b17~mv2.webp", title: "Photo 56" },
      { src: "https://static.wixstatic.com/media/d34ccd_323ba02d93dc491b92be12b692239609~mv2.webp/v1/fit/w_2400,h_3600,q_95,enc_auto/d34ccd_323ba02d93dc491b92be12b692239609~mv2.webp", title: "Photo 57" },
      { src: "https://static.wixstatic.com/media/d34ccd_2813ca42da5d4177a35e589c0b1ce195~mv2.webp/v1/fit/w_2400,h_3600,q_95,enc_auto/d34ccd_2813ca42da5d4177a35e589c0b1ce195~mv2.webp", title: "Photo 58" }
    ];

    let currentList = [];
    let currentIndex = 0;

    const grid = document.getElementById('gallery-grid');
    allPhotos.forEach((photo, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<img src="' + photo.src + '" alt="' + photo.title + '" loading="lazy">';
      card.onclick = () => {
        currentList = allPhotos.map(p => p.src);
        openLightbox(index);
      };
      grid.appendChild(card);
    });

    function openLightbox(index) {
      currentIndex = index;
      document.getElementById('lightbox-img').src = currentList[currentIndex];
      document.getElementById('lb-counter').textContent = (currentIndex+1) + ' / ' + currentList.length;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = 'auto';
    }
    function nextPhoto() {
      currentIndex = (currentIndex + 1) % currentList.length;
      document.getElementById('lightbox-img').src = currentList[currentIndex];
      document.getElementById('lb-counter').textContent = (currentIndex+1) + ' / ' + currentList.length;
    }
    function prevPhoto() {
      currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
      document.getElementById('lightbox-img').src = currentList[currentIndex];
      document.getElementById('lb-counter').textContent = (currentIndex+1) + ' / ' + currentList.length;
    }
    document.getElementById('lightbox').onclick = e => { if (e.target.id === 'lightbox') closeLightbox(); };
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') nextPhoto();
      if (e.key === 'ArrowLeft') prevPhoto();
    });
  </script>
</body>
</html>
