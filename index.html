<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GirlsGX | 18+</title>
  <style>
    :root {
      --bg: #0f0a0d;
      --card: #1a1216;
      --accent: #f9a8d4;
      --accent-soft: #f472b6;
      --accent-deep: #ec4899;
      --text: #fdf2f8;
      --muted: #d8b4c8;
      --border: #3b2433;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* ===== AGE GATE ===== */
    #age-gate {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(8px);
    }

    .age-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    .age-box h2 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .age-box p {
      color: var(--muted);
      margin-bottom: 28px;
    }

    .age-btns {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: all 0.25s ease;
    }

    .btn-yes {
      background: var(--accent);
      color: white;
    }

    .btn-yes:hover {
      background: var(--accent-soft);
      transform: translateY(-2px);
    }

    .btn-no {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-no:hover {
      border-color: var(--muted);
      color: var(--text);
    }



    /* ===== HERO ===== */
    .hero {
      padding: 80px 0 60px;
      text-align: center;
      position: relative;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(249,168,212,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 20%, #f9a8d4 60%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.15rem;
      max-width: 540px;
      margin: 0 auto 32px;
    }

    .badge {
      display: inline-block;
      background: rgba(249,168,212,0.18);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }


    /* ===== COVER ===== */
    .covers-row {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 50px;
    }

    .cover-wrap {
      position: relative;
      flex: 1 1 280px;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .cover-wrap:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(244, 114, 182, 0.25);
    }

    .cover-img {
      width: 100%;
      display: block;
      aspect-ratio: 3/4;
      object-fit: cover;
      object-position: center top;
    }

    .cover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15,10,13,0.75) 0%, transparent 45%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 28px;
      opacity: 0.9;
      transition: opacity 0.3s;
    }

    .cover-wrap:hover .cover-overlay {
      opacity: 1;
    }

    .cover-play {
      background: rgba(249, 168, 212, 0.95);
      color: #1a1216;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }

    /* ===== GALLERY ===== */
    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding-bottom: 80px;
    }

    .card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      aspect-ratio: 3/4;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.04);
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }

    .card:hover .card-overlay {
      opacity: 1;
    }

    .card-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .card-meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* ===== LIGHTBOX ===== */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.97);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 0;
      overflow: auto;
    }

    #lightbox.active {
      display: flex;
    }

    #lightbox img {
      max-width: 96vw;
      max-height: 92vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 0 50px rgba(0,0,0,0.7);
      display: block;
      image-rendering: auto;
    }

    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.55);
      border: none;
      color: white;
      font-size: 2.4rem;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 2002;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      line-height: 1;
    }

    .lb-nav:hover {
      background: rgba(244, 114, 182, 0.85);
    }

    .lb-prev { left: 16px; }
    .lb-next { right: 16px; }

    .lb-counter {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-size: 0.95rem;
      background: rgba(0,0,0,0.5);
      padding: 6px 16px;
      border-radius: 999px;
      z-index: 2002;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: white;
      font-size: 2.4rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.9;
      transition: opacity 0.2s, background 0.2s;
      z-index: 2001;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .lightbox-close:hover {
      opacity: 1;
      background: rgba(244,114,182,0.85);
    }

    /* ===== FOOTER ===== */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .container {
        padding: 0 16px;
      }
      .hero {
        padding: 40px 0 28px;
      }
      .hero h1 {
        font-size: 2.2rem;
      }
      .covers-row {
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .cover-wrap {
        max-width: 100%;
        width: 100%;
      }
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .section-title {
        font-size: 1.3rem;
      }
      .lb-nav {
        width: 42px;
        height: 42px;
        font-size: 1.8rem;
      }
      .lb-prev { left: 8px; }
      .lb-next { right: 8px; }
      .lightbox-close {
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
        font-size: 1.8rem;
      }
      #lightbox img {
        max-width: 100vw;
        max-height: 85vh;
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .age-box {
        padding: 28px 20px;
      }
      .age-btns {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>

    let currentList = featuredPhotos;
    let currentIndex = 0;

    // Cover 1 opens featured album 1
    document.getElementById('cover-btn').addEventListener('click', () => {
      currentList = featuredPhotos;
      openLightbox(0);
    });

    // Cover 2 opens featured album 2
    document.getElementById('cover-btn2').addEventListener('click', () => {
      currentList = featuredPhotos2;
      openLightbox(0);
    });

    // Render full gallery grid
    const grid = document.getElementById('gallery-grid');
    allPhotos.forEach((photo, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${photo.src}" alt="${photo.title}" loading="lazy">`;
      card.addEventListener('click', () => {
        currentList = allPhotos.map(p => p.src);
        openLightbox(index);
      });
      grid.appendChild(card);
    });

    // ===== LIGHTBOX =====
    function openLightbox(index) {
      currentIndex = index;
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = currentList[currentIndex];
      document.getElementById('lb-counter').textContent = (currentIndex + 1) + ' / ' + currentList.length;
      lb.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function nextPhoto() {
      currentIndex = (currentIndex + 1) % currentList.length;
      document.getElementById('lightbox-img').src = currentList[currentIndex];
      document.getElementById('lb-counter').textContent = (currentIndex + 1) + ' / ' + currentList.length;
    }

    function prevPhoto() {
      currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
      document.getElementById('lightbox-img').src = currentList[currentIndex];
      document.getElementById('lb-counter').textContent = (currentIndex + 1) + ' / ' + currentList.length;
    }

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') nextPhoto();
      if (e.key === 'ArrowLeft') prevPhoto();
    });
  </script>
